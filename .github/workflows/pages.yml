name: Deploy Pages

# Deploys committed public site files to gh-pages (no fetch/collect).
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'about.html'
      - 'feast-days.html'
      - 'trisagion.html'
      - 'join.html'
      - 'assets/**'
      - 'LICENSE'
      - 'scripts/stage_site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage public site
        run: |
          chmod +x scripts/stage_site.sh
          ./scripts/stage_site.sh

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: _site
          clean: true
          clean-exclude: pr-preview
